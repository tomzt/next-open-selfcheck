name: kiosk_mobile
description: "Next-open-selfcheck Kiosk Flutter Mobile App — Patron self-check + RFID + Bookdrop return"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  audio_session: ^0.1.0
  audioplayers: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/success.mp3
    - assets/sounds/error.mp3
    - assets/images/logo.png

  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sarabun-Light.ttf
          weight: 300
